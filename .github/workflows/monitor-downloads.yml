name: Release Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
    steps:
      - name: Determine latest Armada release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/armada-os/armada/releases/latest | python -c "import json,sys; data=json.load(sys.stdin); print(data.get('tag_name',''))")

          if [ -z "$latest" ]; then
            echo "No published release found."
            exit 0
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Restore last seen release tag
        id: cache
        uses: actions/cache@v4
        with:
          path: .armada-release-tag
          key: armada-release-tag-${{ steps.latest.outputs.latest }}

      - name: Compare with stored release
        id: compare
        env:
          LATEST_TAG: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          state_file=".armada-release-tag"
          previous=""

          if [ -f "$state_file" ]; then
            previous=$(cat "$state_file")
          fi

          echo "$LATEST_TAG" > "$state_file"

          if [ -n "$previous" ] && [ "$previous" = "$LATEST_TAG" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger CI workflow
        if: steps.compare.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: context.ref
            });
